<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UAE Secure CRM</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg:#f6f8fb;--card:#fff;--ink:#111827;--muted:#64748b;--line:#dbe3ef;--dark:#111827;--red:#b91c1c}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Segoe UI,Arial,sans-serif;color:var(--ink)}.wrap{max-width:1280px;margin:auto;padding:24px}.top,.actions,.tabs{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between}.actions,.tabs{justify-content:flex-start}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 1px 4px #0001}h1{margin:8px 0 6px}.muted{color:var(--muted)}.small{font-size:12px}.btn,.tab{border:0;border-radius:12px;padding:9px 13px;font-weight:700;cursor:pointer;background:var(--dark);color:white}.secondary,.tab{background:#fff;color:#334155;border:1px solid var(--line)}.danger{background:#fff;color:var(--red);border:1px solid #fecaca}.tab.active{background:#111827;color:#fff}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px;margin:3px 0 8px;font:inherit}textarea{min-height:70px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.section{display:none}.activeSection{display:block}.badge{border-radius:999px;padding:4px 8px;font-size:12px;font-weight:700;background:#e2e8f0}.green{background:#d1fae5;color:#065f46}.amber{background:#fef3c7;color:#92400e}.red{background:#fee2e2;color:#991b1b}.blue{background:#dbeafe;color:#1e40af}.toolbar{display:grid;grid-template-columns:1fr auto auto auto auto;gap:8px;margin:14px 0}.hidden{display:none!important}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff}table{border-collapse:collapse;width:100%;min-width:900px}th,td{padding:9px;border-bottom:1px solid var(--line);font-size:13px;text-align:left;vertical-align:top}th{background:#f1f5f9}.modal{position:fixed;inset:0;background:#0f172a77;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modalbox{background:white;border-radius:20px;max-width:900px;width:100%;max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:14px}.modalbody{padding:14px}.notice{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:14px;padding:12px}@media(max-width:900px){.grid2,.grid3,.grid4,.toolbar{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div id="auth"></div><div id="app" class="hidden"><div class="top"><div><div class="small muted">Diametral / EXSRTEL UAE Partner CRM · Supabase Secure</div><h1>Kontrola obchodních aktivit v SAE</h1><p class="muted">Přihlášení, registrace, schvalování uživatelů, role owner / user_admin / sales_user a zabezpečení přes Supabase RLS.</p><p id="who" class="small muted"></p></div><div class="actions"><button class="btn secondary adminOnly" onclick="exportCSV('companies')">Export firem</button><button class="btn secondary adminOnly" onclick="exportCSV('deals')">Export dealů</button><button class="btn secondary" onclick="loadAll()">Refresh</button><button class="btn danger" onclick="logout()">Odhlásit</button></div></div><div id="pending" class="notice hidden"></div><div id="tabs" class="tabs"></div><div class="toolbar"><input id="q" placeholder="Hledat..." oninput="renderAll()"><button class="btn secondary adminOnly" onclick="openRep()">+ Obchodník</button><button class="btn secondary" onclick="openCompany()">+ Firma</button><button class="btn secondary" onclick="openContact()">+ Kontakt</button><button class="btn" onclick="openDeal()">+ Deal</button></div><section id="dashboard" class="section"></section><section id="users" class="section"></section><section id="reps" class="section"></section><section id="companies" class="section"></section><section id="contacts" class="section"></section><section id="deals" class="section"></section><section id="activities" class="section"></section></div></div><div id="modal" class="modal"><div class="modalbox"><div class="modalhead"><b id="mt"></b><button class="btn secondary" onclick="closeModal()">Zavřít</button></div><div id="mb" class="modalbody"></div></div></div>
<script>
const URL='https://ibocarzxamcqycuctixc.supabase.co';
const KEY='sb_publishable_KXnMTgwGhH6th7yUvG_bfw_7gFkLbEM';
const sb=supabase.createClient(URL,KEY);let session=null,profile=null,tab='dashboard';let data={profiles:[],sales_representatives:[],companies:[],contacts:[],deals:[],activities:[]};
const stages=['Lead','Qualified','Meeting planned','Offer sent','Negotiation','Won','Lost'],segments=['University','Technical school','Industry','Government','Distributor','Contractor','Other'],emirates=['Dubai','Abu Dhabi','Sharjah','Ajman','Ras Al Khaimah','Umm Al Quwain','Fujairah','Oman','Saudi Arabia','Other GCC'],products=['VarioLab+','VarioClick','Electrical laboratory','ESD workplace','Clean room / electronics','Service & maintenance','VR training','Other'];
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function fmt(n,c='USD'){return new Intl.NumberFormat('en-US',{style:'currency',currency:c,maximumFractionDigits:0}).format(Number(n||0))}function today(){return new Date().toISOString().slice(0,10)}function age(d){return Math.max(0,Math.round((new Date(today())-new Date(d||today()))/86400000))}function badge(x,c=''){return `<span class="badge ${c}">${esc(x)}</span>`}function isAdmin(){return profile&&profile.status==='approved'&&(profile.role==='owner'||profile.role==='user_admin')}function approved(){return profile&&profile.status==='approved'}function canEdit(r){return isAdmin()||r.created_by===profile.id}function qmatch(o){let q=document.getElementById('q')?.value.toLowerCase()||'';return JSON.stringify(o).toLowerCase().includes(q)}function company(id){return data.companies.find(x=>x.id===id)||{}}function contact(id){return data.contacts.find(x=>x.id===id)||{}}function rep(id){return data.sales_representatives.find(x=>x.id===id)||{}}function deal(id){return data.deals.find(x=>x.id===id)||{}}function opts(a,s){return a.map(x=>`<option value="${esc(x)}" ${x===s?'selected':''}>${esc(x)}</option>`).join('')}function repOpts(s){return data.sales_representatives.map(r=>`<option value="${r.id}" ${r.id===s?'selected':''}>${esc(r.name)}</option>`).join('')}function compOpts(s){return data.companies.map(c=>`<option value="${c.id}" ${c.id===s?'selected':''}>${esc(c.company)}</option>`).join('')}function contOpts(cid,s){return data.contacts.filter(c=>!cid||c.company_id===cid).map(c=>`<option value="${c.id}" ${c.id===s?'selected':''}>${esc(c.name)}</option>`).join('')}function dealOpts(cid,s){return '<option value="">No deal</option>'+data.deals.filter(d=>!cid||d.company_id===cid).map(d=>`<option value="${d.id}" ${d.id===s?'selected':''}>${esc(d.title)}</option>`).join('')}
async function init(){let r=await sb.auth.getSession();session=r.data.session;if(!session)return authView();await loadProfile();shell();if(approved())await loadAll();else renderAll()}function authView(){document.getElementById('app').classList.add('hidden');document.getElementById('auth').innerHTML=`<div class="grid2"><div class="card"><h1>Secure UAE CRM</h1><p class="muted">Nové účty čekají po registraci na schválení.</p></div><div class="card"><h2>Přihlášení</h2><label>E-mail<input id="le"></label><label>Heslo<input id="lp" type="password"></label><button class="btn" onclick="login()">Přihlásit</button><hr><h2>Registrace</h2><label>Jméno<input id="rn"></label><label>E-mail<input id="re"></label><label>Heslo<input id="rp" type="password"></label><button class="btn secondary" onclick="register()">Registrovat</button><p id="msg" class="small muted"></p></div></div>`}function msg(x){document.getElementById('msg').textContent=x}async function login(){let {error}=await sb.auth.signInWithPassword({email:le.value.trim(),password:lp.value});if(error)return msg(error.message);location.reload()}async function register(){let {error}=await sb.auth.signUp({email:re.value.trim(),password:rp.value,options:{data:{full_name:rn.value.trim()}}});if(error)return msg(error.message);msg('Registrace proběhla. Účet čeká na schválení.')}async function logout(){await sb.auth.signOut();location.reload()}async function loadProfile(){let {data:p,error}=await sb.from('profiles').select('*').eq('id',session.user.id).single();if(error)alert(error.message);profile=p}function shell(){document.getElementById('auth').innerHTML='';app.classList.remove('hidden');who.innerHTML=`Přihlášen: <b>${esc(profile.email)}</b> · role: <b>${profile.role}</b> · stav: <b>${profile.status}</b>`;document.querySelectorAll('.adminOnly').forEach(e=>e.classList.toggle('hidden',!isAdmin()));if(!approved()){pending.classList.remove('hidden');pending.textContent=profile.status==='pending'?'Účet čeká na schválení.':'Účet není aktivní.'}}
async function loadAll(){if(!approved())return;let tables=isAdmin()?['profiles','sales_representatives','companies','contacts','deals','activities']:['sales_representatives','companies','contacts','deals','activities'];for(let t of tables){let {data:rows,error}=await sb.from(t).select('*');if(error)console.error(t,error);else data[t]=rows||[]}shell();renderAll()}
function setTab(t){tab=t;renderAll()}function renderTabs(){let all=['dashboard','users','reps','companies','contacts','deals','activities'];let labs=['Dashboard','Uživatelé','Obchodníci','Firmy','Kontakty','Dealy','Aktivity'];if(!isAdmin()){all=all.filter(x=>x!=='users');}tabs.innerHTML=all.map(k=>`<button class="tab ${tab===k?'active':''}" onclick="setTab('${k}')">${labs[['dashboard','users','reps','companies','contacts','deals','activities'].indexOf(k)]}</button>`).join('')}function renderAll(){renderTabs();document.querySelectorAll('.section').forEach(s=>s.classList.remove('activeSection'));if(tab==='users'&&!isAdmin())tab='dashboard';document.getElementById(tab).classList.add('activeSection');document.querySelectorAll('.adminOnly').forEach(e=>e.classList.toggle('hidden',!isAdmin()));if(!approved()){dashboard.innerHTML='<div class="notice">Účet čeká na schválení.</div>';return}renderDashboard();renderUsers();renderReps();renderCompanies();renderContacts();renderDeals();renderActivities()}
function renderDashboard(){let open=data.deals.filter(d=>!['Won','Lost'].includes(d.stage)),pipe=open.reduce((s,d)=>s+Number(d.value||0),0),stale=open.filter(d=>age(d.last_activity_date)>7);dashboard.innerHTML=`<div class="grid4"><div class="card"><b>Firmy</b><h1>${data.companies.length}</h1></div><div class="card"><b>Obchodníci</b><h1>${data.sales_representatives.length}</h1></div><div class="card"><b>Open pipeline</b><h1>${fmt(pipe)}</h1></div><div class="card"><b>Bez update >7 dní</b><h1>${stale.length}</h1></div></div><div class="card"><h2>Dealy bez aktualizace</h2>${stale.map(d=>`<div class="rowline"><div><b>${esc(company(d.company_id).company)} — ${esc(d.title)}</b><br><span class="muted">${esc(rep(d.sales_rep_id).name)} · ${esc(d.offer_no||'')}</span></div>${badge(age(d.last_activity_date)+' dní','amber')}</div>`).join('')||'<p class="muted">Žádné.</p>'}</div>`}
function renderUsers(){if(!isAdmin())return;let rows=data.profiles.filter(qmatch);users.innerHTML=`<div class="card"><h2>Správa uživatelů</h2><div class="tablewrap"><table><thead><tr><th>Email</th><th>Jméno</th><th>Role</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(u=>`<tr><td>${esc(u.email)}</td><td>${esc(u.full_name)}</td><td>${esc(u.role)}</td><td>${badge(u.status,u.status==='approved'?'green':u.status==='pending'?'amber':'red')}</td><td><button class="btn small" onclick="approveUser('${u.id}','sales_user')">Approve sales</button> ${profile.role==='owner'?`<button class="btn secondary small" onclick="approveUser('${u.id}','user_admin')">Make admin</button>`:''} <button class="btn danger small" onclick="disableUser('${u.id}')">Disable</button></td></tr>`).join('')}</tbody></table></div></div>`}async function approveUser(id,role){let {error}=await sb.rpc('approve_user',{target_user_id:id,new_role:role});if(error)return alert(error.message);await loadAll()}async function disableUser(id){let {error}=await sb.rpc('disable_user',{target_user_id:id});if(error)return alert(error.message);await loadAll()}
function renderReps(){let rows=data.sales_representatives.filter(qmatch);reps.innerHTML=`<div class="grid3">${rows.map(r=>`<div class="card"><h2>${esc(r.name)}</h2><p class="muted">${esc(r.company)} · ${esc(r.territory)}</p><p class="small"><b>Email:</b> ${esc(r.email||'—')}<br><b>Phone:</b> ${esc(r.phone||'—')}</p>${canEdit(r)?`<button class="btn secondary small" onclick="openRep('${r.id}')">Edit</button>`:''}</div>`).join('')}</div>`}
function renderCompanies(){let rows=data.companies.filter(c=>qmatch({...c,salesRep:rep(c.sales_rep_id).name}));companies.innerHTML=`<div class="grid2">${rows.map(c=>`<div class="card"><h2>${esc(c.company)}</h2><p class="muted">${esc(c.segment)} · ${esc(c.emirate)} · ${esc(c.status)}</p><p><b>Obchodník:</b> ${esc(rep(c.sales_rep_id).name||'—')}<br><b>Next:</b> ${esc(c.next_step||'')}</p>${canEdit(c)?`<button class="btn secondary small" onclick="openCompany('${c.id}')">Edit</button> <button class="btn danger small" onclick="del('companies','${c.id}')">Delete</button>`:''}</div>`).join('')}</div>`}
function renderContacts(){let rows=data.contacts.filter(c=>qmatch({...c,company:company(c.company_id).company}));contacts.innerHTML=`<div class="tablewrap"><table><thead><tr><th>Firma</th><th>Jméno</th><th>Pozice</th><th>Email</th><th>Telefon</th><th></th></tr></thead><tbody>${rows.map(c=>`<tr><td>${esc(company(c.company_id).company)}</td><td><b>${esc(c.name)}</b></td><td>${esc(c.position)}</td><td>${esc(c.email)}</td><td>${esc(c.phone)}</td><td>${canEdit(c)?`<button class="btn secondary small" onclick="openContact('${c.id}')">Edit</button>`:''}</td></tr>`).join('')}</tbody></table></div>`}
function renderDeals(){let rows=data.deals.filter(d=>qmatch({...d,company:company(d.company_id).company,contact:contact(d.contact_id).name}));deals.innerHTML=`<div class="tablewrap"><table><thead><tr><th>Firma</th><th>Obchodník</th><th>Deal</th><th>Stage</th><th>Hodnota</th><th>Offer/CORE</th><th></th></tr></thead><tbody>${rows.map(d=>`<tr><td>${esc(company(d.company_id).company)}</td><td>${esc(rep(d.sales_rep_id).name)}</td><td><b>${esc(d.title)}</b><br>${esc(d.product||'')}</td><td>${badge(d.stage,'blue')}</td><td>${fmt(d.value,d.currency)}</td><td>${esc(d.offer_no||'')}<br>${esc(d.core_number||'')}</td><td>${canEdit(d)?`<button class="btn secondary small" onclick="openDeal('${d.id}')">Edit</button>`:''}</td></tr>`).join('')}</tbody></table></div>`}
function renderActivities(){let rows=data.activities.filter(a=>qmatch({...a,company:company(a.company_id).company}));activities.innerHTML=`<button class="btn" onclick="openActivity()">+ Aktivita</button><div class="grid3">${rows.map(a=>`<div class="card"><h2>${esc(a.subject)}</h2><p class="muted">${esc(company(a.company_id).company)} · ${esc(a.type)} · ${esc(a.date)}</p><p>${esc(a.next_action||'')}</p>${canEdit(a)?`<button class="btn secondary small" onclick="openActivity('${a.id}')">Edit</button>`:''}</div>`).join('')}</div>`}
function modal(t,h){mt.textContent=t;mb.innerHTML=h;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}function form(id){return Object.fromEntries(new FormData(document.getElementById(id)).entries())}function chk(n){return document.querySelector(`[name="${n}"]`)?.checked||false}async function upsert(table,id,payload){payload.updated_by=profile.id;let res=id?await sb.from(table).update(payload).eq('id',id):await sb.from(table).insert(payload);if(res.error)return alert(res.error.message);closeModal();await loadAll()}async function del(t,id){if(!confirm('Smazat?'))return;let {error}=await sb.from(t).delete().eq('id',id);if(error)return alert(error.message);await loadAll()}
function openRep(id){if(!isAdmin())return;let r=id?data.sales_representatives.find(x=>x.id===id):{name:'',company:'EXSRTEL',role_title:'Sales representative',email:'',phone:'',whatsapp:'',territory:'Dubai',active:true,notes:''};modal(id?'Edit obchodníka':'Nový obchodník',`<form id="f"><div class="grid2"><label>Jméno<input name="name" value="${esc(r.name)}"></label><label>Firma<input name="company" value="${esc(r.company)}"></label><label>Role<input name="role_title" value="${esc(r.role_title)}"></label><label>Territory<input name="territory" value="${esc(r.territory)}"></label><label>Email<input name="email" value="${esc(r.email)}"></label><label>Phone<input name="phone" value="${esc(r.phone)}"></label></div><label>Notes<textarea name="notes">${esc(r.notes)}</textarea></label><button type="button" class="btn" onclick="saveRep('${id||''}')">Save</button></form>`)}async function saveRep(id){await upsert('sales_representatives',id,form('f'))}
function openCompany(id){let c=id?data.companies.find(x=>x.id===id):{company:'',segment:'University',emirate:'Dubai',status:'New lead',source:'',sales_rep_id:data.sales_representatives[0]?.id||'',next_step:'',next_date:today(),notes:''};if(id&&!canEdit(c))return alert('Nelze editovat cizí záznam.');modal(id?'Edit firmy':'Nová firma',`<form id="f"><div class="grid2"><label>Firma<input name="company" value="${esc(c.company)}"></label><label>Obchodník<select name="sales_rep_id">${repOpts(c.sales_rep_id)}</select></label><label>Segment<select name="segment">${opts(segments,c.segment)}</select></label><label>Emirate<select name="emirate">${opts(emirates,c.emirate)}</select></label><label>Status<input name="status" value="${esc(c.status)}"></label><label>Source<input name="source" value="${esc(c.source)}"></label><label>Next step<input name="next_step" value="${esc(c.next_step)}"></label><label>Date<input type="date" name="next_date" value="${esc(c.next_date)}"></label></div><label>Notes<textarea name="notes">${esc(c.notes)}</textarea></label><button type="button" class="btn" onclick="saveCompany('${id||''}')">Save</button></form>`)}async function saveCompany(id){await upsert('companies',id,form('f'))}
function openContact(id){let c=id?data.contacts.find(x=>x.id===id):{company_id:data.companies[0]?.id||'',name:'',position:'',email:'',phone:'',decision_role:'Influencer',notes:''};if(id&&!canEdit(c))return alert('Nelze editovat cizí záznam.');modal(id?'Edit kontaktu':'Nový kontakt',`<form id="f"><div class="grid2"><label>Firma<select name="company_id">${compOpts(c.company_id)}</select></label><label>Jméno<input name="name" value="${esc(c.name)}"></label><label>Pozice<input name="position" value="${esc(c.position)}"></label><label>Role<input name="decision_role" value="${esc(c.decision_role)}"></label><label>Email<input name="email" value="${esc(c.email)}"></label><label>Phone<input name="phone" value="${esc(c.phone)}"></label></div><button type="button" class="btn" onclick="saveContact('${id||''}')">Save</button></form>`)}async function saveContact(id){await upsert('contacts',id,form('f'))}
function openDeal(id){let d=id?data.deals.find(x=>x.id===id):{company_id:data.companies[0]?.id||'',contact_id:'',sales_rep_id:data.sales_representatives[0]?.id||'',title:'',product:'VarioLab+',value:0,currency:'USD',stage:'Lead',probability:20,close_date:today(),offer_no:'',core_number:'',last_activity_date:today(),last_activity:''};if(id&&!canEdit(d))return alert('Nelze editovat cizí záznam.');modal(id?'Edit dealu':'Nový deal',`<form id="f"><div class="grid2"><label>Firma<select name="company_id">${compOpts(d.company_id)}</select></label><label>Obchodník<select name="sales_rep_id">${repOpts(d.sales_rep_id)}</select></label><label>Kontakt<select name="contact_id"><option value="">—</option>${contOpts(d.company_id,d.contact_id)}</select></label><label>Název<input name="title" value="${esc(d.title)}"></label><label>Produkt<select name="product">${opts(products,d.product)}</select></label><label>Stage<select name="stage">${opts(stages,d.stage)}</select></label><label>Value<input type="number" name="value" value="${esc(d.value)}"></label><label>Currency<input name="currency" value="${esc(d.currency)}"></label><label>Offer<input name="offer_no" value="${esc(d.offer_no)}"></label><label>CORE<input name="core_number" value="${esc(d.core_number)}"></label><label>Last date<input type="date" name="last_activity_date" value="${esc(d.last_activity_date)}"></label></div><label>Last activity<textarea name="last_activity">${esc(d.last_activity)}</textarea></label><button type="button" class="btn" onclick="saveDeal('${id||''}')">Save</button></form>`)}async function saveDeal(id){let f=form('f');f.value=Number(f.value||0);if(!f.contact_id)delete f.contact_id;await upsert('deals',id,f)}
function openActivity(id){let a=id?data.activities.find(x=>x.id===id):{company_id:data.companies[0]?.id||'',deal_id:'',sales_rep_id:data.sales_representatives[0]?.id||'',type:'Call',subject:'',date:today(),result:'Planned',next_action:''};if(id&&!canEdit(a))return alert('Nelze editovat cizí záznam.');modal(id?'Edit aktivity':'Nová aktivita',`<form id="f"><div class="grid2"><label>Firma<select name="company_id">${compOpts(a.company_id)}</select></label><label>Deal<select name="deal_id">${dealOpts(a.company_id,a.deal_id)}</select></label><label>Obchodník<select name="sales_rep_id">${repOpts(a.sales_rep_id)}</select></label><label>Typ<input name="type" value="${esc(a.type)}"></label><label>Subject<input name="subject" value="${esc(a.subject)}"></label><label>Date<input type="date" name="date" value="${esc(a.date)}"></label><label>Result<input name="result" value="${esc(a.result)}"></label></div><label>Next action<textarea name="next_action">${esc(a.next_action)}</textarea></label><button type="button" class="btn" onclick="saveActivity('${id||''}')">Save</button></form>`)}async function saveActivity(id){let f=form('f');if(!f.deal_id)delete f.deal_id;await upsert('activities',id,f)}
function exportCSV(table){if(!isAdmin())return;let rows=table==='companies'?data.companies.map(c=>({company:c.company,salesRepName:rep(c.sales_rep_id).name,segment:c.segment,emirate:c.emirate,status:c.status,source:c.source,nextStep:c.next_step,nextDate:c.next_date})):table==='deals'?data.deals.map(d=>({companyName:company(d.company_id).company,contactName:contact(d.contact_id).name,salesRepName:rep(d.sales_rep_id).name,title:d.title,product:d.product,value:d.value,currency:d.currency,stage:d.stage,offerNo:d.offer_no,coreNumber:d.core_number})):[];downloadCSV('uae-crm-'+table+'.csv',rows)}function downloadCSV(name,rows){if(!rows.length)return alert('Žádná data');let h=[...new Set(rows.flatMap(r=>Object.keys(r)))],csv='\ufeff'+[h.join(';'),...rows.map(r=>h.map(k=>`"${String(r[k]??'').replaceAll('"','""')}"`).join(';'))].join('\n'),blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
init();
