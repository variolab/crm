<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UAE CRM Secure v2</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f6f8fb;--line:#dbe3ef;--dark:#111827;--muted:#64748b;--red:#b91c1c}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Segoe UI,Arial,sans-serif;color:#111827}.wrap{max-width:1320px;margin:auto;padding:24px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 1px 4px #0001}h1{font-size:32px;margin:8px 0}h2{font-size:18px;margin:0 0 12px}.muted{color:var(--muted)}.small{font-size:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.top{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}.actions,.tabs{display:flex;gap:8px;flex-wrap:wrap}.btn,.tab,button{border:0;border-radius:12px;padding:10px 13px;font-weight:700;cursor:pointer;background:#111827;color:white}.secondary,.tab{background:white;color:#334155;border:1px solid var(--line)}.danger{background:white;color:var(--red);border:1px solid #fecaca}.tab.active{background:#111827;color:white}.toolbar{display:grid;grid-template-columns:1fr auto auto auto auto;gap:10px;margin:16px 0}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:white;font:inherit;margin:4px 0 10px}textarea{min-height:80px}.section{display:none}.section.active{display:block}.hidden{display:none!important}.badge{display:inline-block;border-radius:999px;padding:4px 8px;background:#e2e8f0;font-size:12px;font-weight:700}.green{background:#d1fae5;color:#065f46}.amber{background:#fef3c7;color:#92400e}.red{background:#fee2e2;color:#991b1b}.blue{background:#dbeafe;color:#1e40af}.metric .value{font-size:26px;font-weight:800}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:white}table{border-collapse:collapse;width:100%;min-width:1000px}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}th{background:#f1f5f9}.modal{position:fixed;inset:0;background:#0f172a77;display:none;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.modalbox{background:white;border-radius:20px;max-width:900px;width:100%;max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:14px}.modalbody{padding:16px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.full{grid-column:1/-1}.notice{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:12px;padding:12px;margin:12px 0}pre{background:#111827;color:#e5e7eb;padding:12px;border-radius:10px;overflow:auto}@media(max-width:900px){.grid2,.grid3,.grid5,.toolbar,.formgrid{grid-template-columns:1fr}.wrap{padding:14px}}
</style>
</head>
<body>
<div class="wrap">
  <div id="fatal" class="card hidden"></div>
  <div id="auth"></div>
  <div id="app" class="hidden">
    <div class="top card">
      <div><h1>Kontrola obchodních aktivit v SAE</h1><p class="muted">Secure CRM napojené na Supabase · v2</p><p id="who" class="small muted"></p></div>
      <div class="actions"><button class="secondary adminOnly" onclick="exportCSV('companies')">Export firem</button><button class="secondary adminOnly" onclick="exportCSV('deals')">Export dealů</button><button class="secondary" onclick="loadAll()">Refresh</button><button class="danger" onclick="logout()">Odhlásit</button></div>
    </div>
    <div id="pending" class="notice hidden"></div>
  <div id="languageStrip" class="actions" style="margin:14px 0;">
    <button id="langCsTop" class="btn secondary" onclick="crmSetLanguageSafe('cs')">CZ</button>
    <button id="langEnTop" class="btn secondary" onclick="crmSetLanguageSafe('en')">EN</button>
    <span id="searchHint" class="pill">Vyhledávání níže filtruje záznamy v CRM</span>
  </div>
    <div id="tabs" class="tabs"></div>
    <div class="toolbar"><input id="q" placeholder="Hledat..." oninput="renderAll()"><button class="secondary adminOnly" onclick="openSalesRep()">+ Obchodník</button><button class="secondary" onclick="openCompany()">+ Firma</button><button class="secondary" onclick="openContact()">+ Kontakt</button><button onclick="openDeal()">+ Deal</button></div>
    <section id="dashboard" class="section"></section><section id="users" class="section"></section><section id="salesreps" class="section"></section><section id="companies" class="section"></section><section id="contacts" class="section"></section><section id="deals" class="section"></section><section id="activities" class="section"></section><section id="process" class="section"></section>
  </div>
</div>
<div id="modal" class="modal"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle"></h2><button class="secondary" onclick="closeModal()">Zavřít</button></div><div id="modalBody" class="modalbody"></div></div></div>
<script>
window.addEventListener('error',e=>showFatal('Chyba aplikace',String(e.message)+'\nline: '+String(e.lineno)));
const SUPABASE_URL='https://ibocarzxamcqycuctixc.supabase.co';
const SUPABASE_KEY='sb_publishable_KXnMTgwGhH6th7yUvG_bfw_7gFkLbEM';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let session=null,profile=null,tab='dashboard';
let data={profiles:[],sales_representatives:[],companies:[],contacts:[],deals:[],activities:[]};
const stages=['Lead','Qualified','Meeting planned','Offer sent','Negotiation','Won','Lost'];
const products=['VarioLab+','VarioClick','Electrical laboratory','ESD workplace','Clean room / electronics','Service & maintenance','VR training','Other'];
const segments=['University','Technical school','Industry','Government','Distributor','Contractor','Other'];
const emirates=['Dubai','Abu Dhabi','Sharjah','Ajman','Ras Al Khaimah','Umm Al Quwain','Fujairah','Oman','Saudi Arabia','Other GCC'];
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function badge(x,c=''){return '<span class="badge '+c+'">'+esc(x)+'</span>'}
function fmt(n,c='USD'){return new Intl.NumberFormat('en-US',{style:'currency',currency:c||'USD',maximumFractionDigits:0}).format(Number(n||0))}
function today(){return new Date().toISOString().slice(0,10)}
function ageDays(d){return Math.max(0,Math.round((new Date(today())-new Date(d||today()))/86400000))}
function isAdmin(){return profile&&(profile.role==='owner'||profile.role==='user_admin')&&profile.status==='approved'}
function isApproved(){return profile&&profile.status==='approved'}
function canEdit(r){return isAdmin()||r.created_by===profile.id}
function company(id){return data.companies.find(x=>x.id===id)||{}}
function rep(id){return data.sales_representatives.find(x=>x.id===id)||{}}
function contact(id){return data.contacts.find(x=>x.id===id)||{}}
function deal(id){return data.deals.find(x=>x.id===id)||{}}
function qmatch(o){let q=document.getElementById('q')?.value.toLowerCase()||'';return JSON.stringify(o).toLowerCase().includes(q)}
function showFatal(t,m){let b=document.getElementById('fatal');if(b){b.classList.remove('hidden');b.innerHTML='<h2>'+esc(t)+'</h2><pre>'+esc(m)+'</pre>'}}
async function init(){const res=await sb.auth.getSession();session=res.data.session;if(!session){renderAuth();return}const pr=await sb.from('profiles').select('*').eq('id',session.user.id).single();if(pr.error){showFatal('Profil se nepodařilo načíst',pr.error.message);return}profile=pr.data;renderShell(); setTimeout(crmApplyLanguageSafe,0);if(isApproved())await loadAll();else renderAll()}
function renderAuth(){app.classList.add('hidden');auth.innerHTML='<div class="grid2"><div class="card"><h1>Secure UAE CRM</h1><p class="muted">Přihlášení do zabezpečeného CRM.</p><pre>URL = '+esc(SUPABASE_URL)+'\nSupabase OK</pre></div><div class="card"><h2>Přihlášení</h2><label>E-mail<input id="loginEmail"></label><label>Heslo<input id="loginPassword" type="password"></label><button onclick="login()">Přihlásit</button><hr><h2>Registrace</h2><label>Jméno<input id="regName"></label><label>E-mail<input id="regEmail"></label><label>Heslo<input id="regPassword" type="password"></label><button class="secondary" onclick="register()">Registrovat</button><p id="msg" class="small muted"></p></div></div>'}
function msg(x){document.getElementById('msg').textContent=x}
async function login(){let r=await sb.auth.signInWithPassword({email:loginEmail.value.trim(),password:loginPassword.value});if(r.error){msg(r.error.message);return}location.reload()}
async function register(){let r=await sb.auth.signUp({email:regEmail.value.trim(),password:regPassword.value,options:{data:{full_name:regName.value.trim()}}});if(r.error){msg(r.error.message);return}msg('Registrace proběhla. Účet čeká na schválení.')}
async function logout(){await sb.auth.signOut();location.reload()}
function renderShell(){auth.innerHTML='';app.classList.remove('hidden');who.innerHTML='Přihlášen: <b>'+esc(profile.email)+'</b> · role: <b>'+esc(profile.role)+'</b> · status: <b>'+esc(profile.status)+'</b>';document.querySelectorAll('.adminOnly').forEach(e=>e.classList.toggle('hidden',!isAdmin()));if(!isApproved()){pending.classList.remove('hidden');pending.textContent='Váš účet čeká na schválení nebo není aktivní.'}}
async function loadAll(){const tables=isAdmin()?['profiles','sales_representatives','companies','contacts','deals','activities']:['sales_representatives','companies','contacts','deals','activities'];for(const t of tables){let r=await sb.from(t).select('*');if(r.error){showFatal('Chyba načtení '+t,r.error.message);return}data[t]=r.data||[]}renderShell();renderAll()}
function renderTabs(){const keys=isAdmin()?['dashboard','users','salesreps','companies','contacts','deals','activities','process']:['dashboard','salesreps','companies','contacts','deals','activities','process'];const names={dashboard:'Dashboard',users:'Uživatelé',salesreps:'Obchodníci',companies:'Firmy',contacts:'Kontakty',deals:'Dealy / nabídky',activities:'Aktivity',process:'Procesní kontrola'};tabs.innerHTML=keys.map(k=>'<button class="tab '+(tab===k?'active':'')+'" onclick="setTab(\''+k+'\')">'+names[k]+'</button>').join('')}
function setTab(k){tab=k;renderAll()}
function renderAll(){renderTabs();document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));if(!document.getElementById(tab))tab='dashboard';document.getElementById(tab).classList.add('active');document.querySelectorAll('.adminOnly').forEach(e=>e.classList.toggle('hidden',!isAdmin()));if(!isApproved()){dashboard.innerHTML='<div class="notice">Váš účet čeká na schválení nebo není aktivní.</div>';return}renderDashboard();renderUsers();renderSalesReps();renderCompanies();renderContacts();renderDeals();renderActivities();renderProcess()}
function repStats(id){let open=data.deals.filter(d=>d.sales_rep_id===id&&!['Won','Lost'].includes(d.stage));let acts=data.activities.filter(a=>a.sales_rep_id===id);return{companies:data.companies.filter(c=>c.sales_rep_id===id).length,pipeline:open.reduce((s,d)=>s+Number(d.value||0),0),activities:acts.length}}
function renderDashboard(){let open=data.deals.filter(d=>!['Won','Lost'].includes(d.stage));let pipe=open.reduce((s,d)=>s+Number(d.value||0),0);let weighted=open.reduce((s,d)=>s+Number(d.value||0)*Number(d.probability||0)/100,0);let stale=data.deals.filter(d=>!['Won','Lost'].includes(d.stage)&&ageDays(d.last_activity_date)>7);dashboard.innerHTML='<div class="grid5"><div class="card metric"><div class="label">Obchodníci</div><div class="value">'+data.sales_representatives.filter(r=>r.active).length+'</div></div><div class="card metric"><div class="label">Firmy</div><div class="value">'+data.companies.length+'</div></div><div class="card metric"><div class="label">Open pipeline</div><div class="value">'+fmt(pipe)+'</div></div><div class="card metric"><div class="label">Weighted</div><div class="value">'+fmt(weighted)+'</div></div><div class="card metric"><div class="label">Bez update > 7 dní</div><div class="value">'+stale.length+'</div></div></div>'}
function renderUsers(){if(!isAdmin())return;let rows=data.profiles.filter(qmatch);users.innerHTML='<div class="card"><h2>Správa uživatelů</h2><div class="tablewrap"><table><tr><th>Email</th><th>Jméno</th><th>Role</th><th>Status</th><th></th></tr>'+rows.map(u=>'<tr><td><b>'+esc(u.email)+'</b></td><td>'+esc(u.full_name)+'</td><td>'+esc(u.role)+'</td><td>'+badge(u.status,u.status==='approved'?'green':u.status==='pending'?'amber':'red')+'</td><td>'+(u.status!=='approved'?'<button class="btn small" onclick="approveUser(\''+u.id+'\',\'sales_user\')">Approve sales</button> ':'')+(profile.role==='owner'?'<button class="btn secondary small" onclick="approveUser(\''+u.id+'\',\'user_admin\')">Make admin</button> ':'')+'<button class="btn danger small" onclick="disableUser(\''+u.id+'\')">Disable</button></td></tr>').join('')+'</table></div></div>'}
async function approveUser(id,role){let r=await sb.rpc('approve_user',{target_user_id:id,new_role:role});if(r.error){alert(r.error.message);return}await loadAll()}
async function disableUser(id){let r=await sb.rpc('disable_user',{target_user_id:id});if(r.error){alert(r.error.message);return}await loadAll()}
function renderSalesReps(){let rows=data.sales_representatives.filter(qmatch);salesreps.innerHTML='<div style="margin-bottom:12px" class="adminOnly"><button class="btn" onclick="openSalesRep()">+ Nový obchodník</button></div><div class="grid3">'+rows.map(r=>{let s=repStats(r.id);return '<div class="card"><h2>'+esc(r.name)+'</h2><p class="muted">'+esc(r.company||'')+' · '+esc(r.role_title||'')+' · '+esc(r.territory||'')+'</p><p class="small"><b>E-mail:</b> '+esc(r.email||'—')+'<br><b>Phone:</b> '+esc(r.phone||'—')+'</p><div class="kpis">'+badge('Companies: '+s.companies,'blue')+badge('Pipeline: '+fmt(s.pipeline),'green')+badge('Activities: '+s.activities)+'</div>'+(canEdit(r)?'<button class="btn secondary small" onclick="openSalesRep(\''+r.id+'\')">Edit</button>':'')+'</div>'}).join('')+'</div>'}
function renderCompanies(){let rows=data.companies.filter(c=>qmatch({...c,salesRep:rep(c.sales_rep_id).name}));companies.innerHTML='<div class="grid2">'+rows.map(c=>'<div class="card"><h2>'+esc(c.company)+'</h2><p class="muted">'+esc(c.segment||'')+' · '+esc(c.emirate||'')+' · '+badge(c.status||'')+'</p><p><b>Sales rep:</b> '+esc(rep(c.sales_rep_id).name||'—')+'<br><b>Next:</b> '+esc(c.next_step||'')+'</p>'+(canEdit(c)?'<button class="btn secondary small" onclick="openCompany(\''+c.id+'\')">Edit</button>':'')+'</div>').join('')+'</div>'}
function renderContacts(){let rows=data.contacts.filter(c=>qmatch({...c,company:company(c.company_id).company}));contacts.innerHTML='<div class="tablewrap"><table><tr><th>Firma</th><th>Jméno</th><th>Pozice</th><th>E-mail</th><th>Telefon</th><th></th></tr>'+rows.map(c=>'<tr><td>'+esc(company(c.company_id).company)+'</td><td><b>'+esc(c.name)+'</b></td><td>'+esc(c.position||'')+'</td><td>'+esc(c.email||'')+'</td><td>'+esc(c.phone||'')+'</td><td>'+(canEdit(c)?'<button class="btn secondary small" onclick="openContact(\''+c.id+'\')">Edit</button>':'')+'</td></tr>').join('')+'</table></div>'}
function renderDeals(){let rows=data.deals.filter(d=>qmatch({...d,company:company(d.company_id).company,contact:contact(d.contact_id).name,salesRep:rep(d.sales_rep_id).name}));deals.innerHTML='<div class="tablewrap"><table><tr><th>Firma</th><th>Obchodník</th><th>Kontakt</th><th>Deal</th><th>Produkt</th><th>Stage</th><th>Hodnota</th><th></th></tr>'+rows.map(d=>'<tr><td><b>'+esc(company(d.company_id).company)+'</b></td><td>'+esc(rep(d.sales_rep_id).name||'')+'</td><td>'+esc(contact(d.contact_id).name||'')+'</td><td>'+esc(d.title)+'</td><td>'+esc(d.product||'')+'</td><td>'+badge(d.stage,d.stage==='Won'?'green':d.stage==='Lost'?'red':'blue')+'</td><td>'+fmt(d.value,d.currency)+'</td><td>'+(canEdit(d)?'<button class="btn secondary small" onclick="openDeal(\''+d.id+'\')">Edit</button>':'')+'</td></tr>').join('')+'</table></div>'}
function renderActivities(){let rows=data.activities.filter(a=>qmatch({...a,company:company(a.company_id).company}));activities.innerHTML='<div style="margin-bottom:12px"><button class="btn" onclick="openActivity()">+ Nová aktivita</button></div><div class="grid3">'+rows.map(a=>'<div class="card"><h2>'+esc(a.subject)+'</h2><p class="muted">'+esc(company(a.company_id).company)+'</p><p><b>Date:</b> '+esc(a.date||'')+'</p>'+(canEdit(a)?'<button class="btn secondary small" onclick="openActivity(\''+a.id+'\')">Edit</button>':'')+'</div>').join('')+'</div>'}
function renderProcess(){let issues=data.deals.filter(d=>!d.crm_complete||!d.core_complete||!d.paper_folder||!d.core_number||!d.offer_no);process.innerHTML='<div class="grid3"><div class="card metric"><div class="label">Process issues</div><div class="value">'+issues.length+'</div></div><div class="card metric"><div class="label">Pending users</div><div class="value">'+data.profiles.filter(p=>p.status==='pending').length+'</div></div></div>'}
function opts(arr,sel){return arr.map(x=>'<option value="'+esc(x)+'" '+(x===sel?'selected':'')+'>'+esc(x)+'</option>').join('')}
function repOpts(sel){return data.sales_representatives.map(r=>'<option value="'+esc(r.id)+'" '+(r.id===sel?'selected':'')+'>'+esc(r.name)+'</option>').join('')}
function companyOpts(sel){return data.companies.map(c=>'<option value="'+esc(c.id)+'" '+(c.id===sel?'selected':'')+'>'+esc(c.company)+'</option>').join('')}
function contactOpts(cid,sel){return data.contacts.filter(c=>!cid||c.company_id===cid).map(c=>'<option value="'+esc(c.id)+'" '+(c.id===sel?'selected':'')+'>'+esc(c.name)+'</option>').join('')}
function dealOpts(cid,sel){return '<option value="">No deal</option>'+data.deals.filter(d=>!cid||d.company_id===cid).map(d=>'<option value="'+esc(d.id)+'" '+(d.id===sel?'selected':'')+'>'+esc(d.title)+'</option>').join('')}
function modal(t,h){modalTitle.textContent=t;modalBody.innerHTML=h;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function form(id){return Object.fromEntries(new FormData(document.getElementById(id)).entries())}
function checked(n){return document.querySelector('[name="'+n+'"]')?.checked||false}
function openSalesRep(id=''){if(!isAdmin())return alert('Pouze admin.');let r=id?data.sales_representatives.find(x=>x.id===id):{name:'',company:'EXSRTEL',role_title:'Sales representative',email:'',phone:'',territory:'Dubai',active:true};modal(id?'Edit sales representative':'New sales representative','<form id="fRep" class="formgrid"><label>Name<input name="name" value="'+esc(r.name)+'"></label><label>Company<input name="company" value="'+esc(r.company||'')+'"></label><label>Role<input name="role_title" value="'+esc(r.role_title||'')+'"></label><label>Territory<input name="territory" value="'+esc(r.territory||'')+'"></label><label>Email<input name="email" value="'+esc(r.email||'')+'"></label><label>Phone<input name="phone" value="'+esc(r.phone||'')+'"></label><div class="full"><button type="button" class="btn" onclick="saveRep(\''+id+'\')">Save</button></div></form>')}
async function saveRep(id){await upsert('sales_representatives',id,form('fRep'))}
function openCompany(id=''){let c=id?data.companies.find(x=>x.id===id):{company:'',segment:'University',emirate:'Dubai',status:'New lead',sales_rep_id:data.sales_representatives[0]?.id||'',next_step:''};modal(id?'Edit company':'New company','<form id="fCompany" class="formgrid"><label>Company<input name="company" value="'+esc(c.company)+'"></label><label>Sales rep<select name="sales_rep_id">'+repOpts(c.sales_rep_id)+'</select></label><label>Segment<select name="segment">'+opts(segments,c.segment)+'</select></label><label>Emirate<select name="emirate">'+opts(emirates,c.emirate)+'</select></label><label>Status<input name="status" value="'+esc(c.status||'')+'"></label><label>Next<input name="next_step" value="'+esc(c.next_step||'')+'"></label><div class="full"><button type="button" class="btn" onclick="saveCompany(\''+id+'\')">Save</button></div></form>')}
async function saveCompany(id){await upsert('companies',id,form('fCompany'))}
function openContact(id=''){let c=id?data.contacts.find(x=>x.id===id):{company_id:data.companies[0]?.id||'',name:'',position:'',email:'',phone:''};modal(id?'Edit contact':'New contact','<form id="fContact" class="formgrid"><label>Company<select name="company_id">'+companyOpts(c.company_id)+'</select></label><label>Name<input name="name" value="'+esc(c.name)+'"></label><label>Position<input name="position" value="'+esc(c.position||'')+'"></label><label>Email<input name="email" value="'+esc(c.email||'')+'"></label><label>Phone<input name="phone" value="'+esc(c.phone||'')+'"></label><div class="full"><button type="button" class="btn" onclick="saveContact(\''+id+'\')">Save</button></div></form>')}
async function saveContact(id){await upsert('contacts',id,form('fContact'))}
function openDeal(id=''){let d=id?data.deals.find(x=>x.id===id):{company_id:data.companies[0]?.id||'',contact_id:'',sales_rep_id:data.sales_representatives[0]?.id||'',title:'',product:'VarioLab+',value:0,currency:'USD',stage:'Lead',probability:20,offer_no:'',core_number:''};modal(id?'Edit deal':'New deal','<form id="fDeal" class="formgrid"><label>Company<select name="company_id" id="dealCompany" onchange="refreshDealContacts()">'+companyOpts(d.company_id)+'</select></label><label>Sales rep<select name="sales_rep_id">'+repOpts(d.sales_rep_id)+'</select></label><label>Contact<select name="contact_id" id="dealContact">'+contactOptsForCompany(d.company_id,d.contact_id)+'</select></label><label>Title<input name="title" value="'+esc(d.title)+'"></label><label>Product<select name="product">'+opts(products,d.product)+'</select></label><label>Stage<select name="stage">'+opts(stages,d.stage)+'</select></label><label>Value<input type="number" name="value" value="'+esc(d.value||0)+'"></label><label>Currency<input name="currency" value="'+esc(d.currency||'USD')+'"></label><label>Probability<input type="number" name="probability" value="'+esc(d.probability||0)+'"></label><label>Offer<input name="offer_no" value="'+esc(d.offer_no||'')+'"></label><label>CORE<input name="core_number" value="'+esc(d.core_number||'')+'"></label><div class="full"><button type="button" class="btn" onclick="saveDeal(\''+id+'\')">Save</button></div></form>')}
async function saveDeal(id){let f=form('fDeal');f.value=Number(f.value||0);f.probability=Number(f.probability||0);if(!f.contact_id)delete f.contact_id;await upsert('deals',id,f)}
function openActivity(id=''){let a=id?data.activities.find(x=>x.id===id):{company_id:data.companies[0]?.id||'',deal_id:'',subject:'',date:today(),result:'Planned'};modal(id?'Edit activity':'New activity','<form id="fAct" class="formgrid"><label>Company<select name="company_id">'+companyOpts(a.company_id)+'</select></label><label>Deal<select name="deal_id">'+dealOpts(a.company_id,a.deal_id)+'</select></label><label>Subject<input name="subject" value="'+esc(a.subject)+'"></label><label>Date<input type="date" name="date" value="'+esc(a.date||today())+'"></label><label>Result<input name="result" value="'+esc(a.result||'')+'"></label><div class="full"><button type="button" class="btn" onclick="saveActivity(\''+id+'\')">Save</button></div></form>')}
async function saveActivity(id){let f=form('fAct');if(!f.deal_id)delete f.deal_id;await upsert('activities',id,f)}
async function upsert(table,id,payload){payload.updated_by=profile.id;let r=id?await sb.from(table).update(payload).eq('id',id):await sb.from(table).insert(payload);if(r.error){alert(r.error.message);return}closeModal();await loadAll()}
function exportCSV(table){if(!isAdmin())return;let rows=data[table]||[];downloadCSV('uae-crm-'+table+'.csv',rows)}
function downloadCSV(filename,rows){if(!rows.length)return alert('Žádná data');let heads=[...new Set(rows.flatMap(r=>Object.keys(r)))],escCsv=v=>'"'+String(v??'').replaceAll('"','""')+'"',csv='\ufeff'+[heads.join(';'),...rows.map(r=>heads.map(h=>escCsv(r[h])).join(';'))].join('\n'),blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url)}

let appLang = localStorage.getItem("uae-crm-lang") || "cs";
function setLangOld(lang){
  appLang = lang;
  localStorage.setItem("uae-crm-lang", lang);
  applyLang();
}
function applyLangOld(){
  const d = I18N[appLang] || I18N.cs;
  const h1 = document.querySelector("h1");
  if (h1) h1.textContent = d.title;
  const lead = document.querySelector(".lead");
  if (lead) lead.textContent = d.lead;
  const q = document.getElementById("q");
  if (q) q.placeholder = d.search;
}
function contactOptsForCompany(companyId, selectedId){
  return data.contacts
    .filter(c => !companyId || c.company_id === companyId)
    .map(c => '<option value="' + esc(c.id) + '" ' + (c.id === selectedId ? 'selected' : '') + '>' + esc(c.name || '') + '</option>')
    .join('');
}
function refreshDealContacts(){
  const companySelect = document.getElementById("dealCompany");
  const contactSelect = document.getElementById("dealContact");
  if (!companySelect || !contactSelect) return;
  contactSelect.innerHTML = contactOptsForCompany(companySelect.value, "");
}

applyLang();

var crmCurrentLang = localStorage.getItem("uae-crm-lang") || "cs";

  localStorage.setItem("uae-crm-lang", lang);
  applyLangSimple();
}

  }

  var q = document.getElementById("q");
  if (q) q.placeholder = isEn ? "Search company, sales rep, contact, deal, CORE number..." : "Hledat firmu, obchodníka, kontakt, deal, CORE číslo...";

  replaceButtonText("Odhlásit", isEn ? "Logout" : "Odhlásit");

  replaceButtonText("+ Nový obchodník", isEn ? "+ New sales rep" : "+ Nový obchodník");
  replaceButtonText("+ New sales rep", isEn ? "+ New sales rep" : "+ Nový obchodník");
  replaceButtonText("+ Nová firma", isEn ? "+ New company" : "+ Nová firma");
  replaceButtonText("+ New company", isEn ? "+ New company" : "+ Nová firma");
  replaceButtonText("+ Nový kontakt", isEn ? "+ New contact" : "+ Nový kontakt");
  replaceButtonText("+ New contact", isEn ? "+ New contact" : "+ Nový kontakt");
  replaceButtonText("+ Nový deal", isEn ? "+ New deal" : "+ Nový deal");
  replaceButtonText("+ New deal", isEn ? "+ New deal" : "+ Nový deal");

  var cs = document.getElementById("btnLangCs");

function replaceButtonText(from, to) {
  document.querySelectorAll("button").forEach(function(btn) {
    if (btn.textContent.trim() === from) btn.textContent = to;
  });
}

/* compatibility: if older code calls applyLang/setLang */
function applyLang() { applyLangSimple(); }
function setLang(lang) { setLangSimple(lang); }

  crmApplyLanguageSafe();

function crmApplyLanguageSafe() {

  crmReplaceButtonText("Logout", isEn ? "Logout" : "Odhlásit");

  crmReplaceButtonText("Export obchodníků", isEn ? "Export sales reps" : "Export obchodníků");
  crmReplaceButtonText("Export sales reps", isEn ? "Export sales reps" : "Export obchodníků");

  crmReplaceButtonText("Export firem", isEn ? "Export companies" : "Export firem");
  crmReplaceButtonText("Export companies", isEn ? "Export companies" : "Export firem");

  crmReplaceButtonText("Export dealů", isEn ? "Export deals" : "Export dealů");
  crmReplaceButtonText("Export deals", isEn ? "Export deals" : "Export dealů");

  crmReplaceButtonText("+ Nový obchodník", isEn ? "+ New sales rep" : "+ Nový obchodník");
  crmReplaceButtonText("+ New sales rep", isEn ? "+ New sales rep" : "+ Nový obchodník");

  crmReplaceButtonText("+ Nová firma", isEn ? "+ New company" : "+ Nová firma");
  crmReplaceButtonText("+ New company", isEn ? "+ New company" : "+ Nová firma");

  crmReplaceButtonText("+ Nový kontakt", isEn ? "+ New contact" : "+ Nový kontakt");
  crmReplaceButtonText("+ New contact", isEn ? "+ New contact" : "+ Nový kontakt");

  crmReplaceButtonText("+ Nový deal", isEn ? "+ New deal" : "+ Nový deal");
  crmReplaceButtonText("+ New deal", isEn ? "+ New deal" : "+ Nový deal");

  var cs = document.getElementById("langCsTop");

  if (cs && en) {
    cs.style.fontWeight = isEn ? "700" : "900";
    en.style.fontWeight = isEn ? "900" : "700";
  }
}

function crmReplaceButtonText(from, to) {
  var buttons = document.querySelectorAll("button");
  for (var i = 0; i < buttons.length; i++) {
    if (buttons[i].textContent.trim() === from) {
      buttons[i].textContent = to;
    }
  }
}

/* compatibility names used by older injected code */
function setLang(lang) { crmSetLanguageSafe(lang); }
function setLangSimple(lang) { crmSetLanguageSafe(lang); }
function applyLang() { crmApplyLanguageSafe(); }
function applyLangSimple() { crmApplyLanguageSafe(); }

init();
setTimeout(crmApplyLanguageSafe, 0);
setTimeout(applyLangSimple, 0);
