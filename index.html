<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UAE CRM Secure</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
body{font-family:Segoe UI,Arial,sans-serif;background:#f5f7fb;margin:0}
.wrap{max-width:900px;margin:40px auto;padding:20px}
.card{background:white;border:1px solid #dbe3ef;border-radius:18px;padding:20px}
input{width:100%;padding:10px;margin:6px 0 14px;border:1px solid #dbe3ef;border-radius:10px}
button{padding:10px 14px;border:0;border-radius:10px;background:#111827;color:white;font-weight:700;cursor:pointer}
pre{background:#111827;color:#e5e7eb;padding:12px;border-radius:10px}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>UAE CRM – Supabase test</h1>
<p id="status">Inicializace…</p>
<input id="email" placeholder="E-mail">
<input id="password" type="password" placeholder="Heslo">
<button onclick="login()">Přihlásit</button>
<pre id="diag"></pre>
</div>
</div>

<script>
const SUPABASE_URL = "https://ibocarzxamcqycuctixc.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_KXnMTgwGhH6th7yUvG_bfw_7gFkLbEM";

const diag = document.getElementById("diag");

function log(x){
  diag.textContent += x + "\n";
}

log("URL = " + SUPABASE_URL);

try {

  const sb = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  window.sb = sb;

  log("Supabase OK");
  document.getElementById("status").textContent = "Supabase připojení funguje";

} catch(e){

  log("ERROR:");
  log(e.message);

  document.getElementById("status").textContent = "Chyba Supabase";

}

async function login(){

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const result = await window.sb.auth.signInWithPassword({
    email,
    password
  });

  if(result.error){
    alert(result.error.message);
    return;
  }

  alert("Přihlášení OK");
}
</script>
</body>
</html>
